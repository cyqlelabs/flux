[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
flux-core = { path = "crates/flux-core" }
flux-ingest = { path = "crates/flux-ingest" }
flux-probe = { path = "crates/flux-probe" }
flux-plan = { path = "crates/flux-plan" }
flux-native = { path = "crates/flux-native" }
flux-serve = { path = "crates/flux-serve" }
flux-bench = { path = "crates/flux-bench" }
flux-worker = { path = "crates/flux-worker" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
hex = "0.4"
memmap2 = "0.9"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
axum = "0.8"
tower-http = { version = "0.6", features = ["limit", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nvml-wrapper = "0.11"
tempfile = "3"
cc = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
debug = 1

# Hashing and JSON over multi-GB artifacts are unusable unoptimized, even in dev builds.
[profile.dev.package."*"]
opt-level = 3
